<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="我的烘焙配方，收录吐司、巴斯克、面包和蛋白棒的用量与烤箱记录。">
<meta name="theme-color" content="#68464e">
<title>我的烘焙配方</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <span class="brand"><img src="assets/bread-icon.png" alt="" width="56" height="40">Baking journal</span>
      <button type="button" class="language-switch" id="language-switch" lang="en" aria-label="Switch to English">English</button>
    </div>
    <div class="hero-copy"><h1>我的烘焙配方</h1><p id="hero-description">吐司、巴斯克和下次想烤的点心</p></div>
    <p class="language-message" id="language-message" role="status" aria-live="polite"></p>
  </div>
</header>
<main class="wrap">
  <div class="toolbar" hidden>
    <div class="search">
      <label for="search">找配方</label>
      <input id="search" type="search" placeholder="试试输入 黑芝麻、酸奶、波兰种" autocomplete="off">
    </div>
    <div class="filters" role="group" aria-label="筛选配方">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="bread" aria-pressed="false">面包</button>
      <button type="button" data-filter="cake" aria-pressed="false">蛋糕</button>
      <button type="button" data-filter="snack" aria-pressed="false">点心</button>
      <button type="button" data-filter="planned" aria-pressed="false">待试做</button>
    </div>
  </div>
  <p class="count" role="status"></p>
  <p class="empty" hidden>没有找到配方。试试换个关键词或点「全部」。</p>

  <div id="recipes" aria-live="polite"></div>
  <p id="load-message" role="status">正在加载配方…</p>
  <noscript>需要启用 JavaScript 才能查看配方。 / Enable JavaScript to view recipes.</noscript>

</main>
  <script src="app.js?v=12" defer></script>
</body>
</html>
